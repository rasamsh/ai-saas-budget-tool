# Amount-based rules — exact dollar match, checked BEFORE pattern rules
# Great for fixed recurring payments like car loans
amount_rules:
  - amount: 688.76
    category: Car Loan
    type: debt

# Known income sources — matched against the raw description of checking credits.
# These no longer decide direction (the bank's sign does, and a credit is always
# income); a credit matching none of them is flagged for review at import time.
income_patterns:
  - "PAYROLL"
  - "DIRECT DEP"
  - "DIRECT DEPOSIT"
  - "ACH CREDIT"
  - "ZELLE FROM"
  - "ZELLE CREDIT"
