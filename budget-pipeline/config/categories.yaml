# Pattern rules — case-insensitive substring match on raw description
# First match wins. Add your own rules here.
rules:
  # Incoming money — the direction is in the wording itself ("... FROM ...",
  # "DEPOSIT", "PAYROLL"), so these are safe to match on any transaction, not
  # just rows the bank flagged as credits. That is what lets --recategorize
  # repair a credit that was stored with the wrong sign. Listed first so a
  # spending rule can never claim an incoming transfer.
  - pattern: "TRANSFER FROM"
    category: Income
    type: income
  - pattern: "ZELLE PAYMENT FROM"
    category: Income
    type: income
  - pattern: "QUICKPAY FROM"
    category: Income
    type: income
  - pattern: "DEPOSIT FROM"
    category: Income
    type: income
  - pattern: "MOBILE DEPOSIT"
    category: Income
    type: income
  - pattern: "REMOTE ONLINE DEPOSIT"
    category: Income
    type: income
  - pattern: "ATM DEPOSIT"
    category: Income
    type: income
  - pattern: "PAYROLL"
    category: Income
    type: income
  - pattern: "DIRECT DEP"
    category: Income
    type: income
  - pattern: "ACH CREDIT"
    category: Income
    type: income

